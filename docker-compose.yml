services:
  pianoteq-remote:
    build: .
    container_name: pianoteq-remote
    ports:
      - "8080:80"
    environment:
      # IP / hostname of the machine running Pianoteq
      - PIANOTEQ_HOST=192.168.1.100
      # Pianoteq JSON-RPC port
      - PIANOTEQ_PORT=8081
    restart: unless-stopped
